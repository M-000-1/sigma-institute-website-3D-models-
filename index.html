<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigma Institute of Education | 3D Campus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Arial,sans-serif;background:#07152e;color:white}
#scene{width:100vw;height:100vh;display:block}
.panel{
 position:fixed;z-index:5;top:15px;left:15px;
 background:rgba(5,18,42,.88);padding:15px;
 border:1px solid #d4af37;border-radius:12px;
 max-width:290px;backdrop-filter:blur(8px)
}
.panel h2{color:#e5c45c;font-size:18px;margin-bottom:6px}
.panel p{font-size:12px;color:#dce5f5;line-height:1.5}
.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
button{
 background:#d4af37;color:#07152e;border:0;padding:9px 11px;
 border-radius:7px;font-weight:bold;font-size:12px
}
#hint{
 position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
 background:rgba(5,18,42,.85);padding:10px 14px;
 border-radius:8px;font-size:12px;text-align:center;
 width:max-content;max-width:90%;color:white
}
</style>
</head>
<body>

<div class="panel">
 <h2>SIGMA INSTITUTE</h2>
 <p>Welcome to Sigma Institute of Education, Madhogarh, Jalaun, Uttar Pradesh.</p>
 <div class="controls">
  <button onclick="toggleDay()">Day / Night</button>
  <button onclick="tour()">Campus Tour</button>
  <button onclick="resetView()">Reset View</button>
 </div>
</div>

<div id="hint">Drag to rotate • Pinch to zoom • Touch controls supported</div>
<canvas id="scene"></canvas>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91bce0);
scene.fog=new THREE.Fog(0x91bce0,65,150);

const camera=new THREE.PerspectiveCamera(
 55,window.innerWidth/window.innerHeight,.1,300
);
camera.position.set(24,19,30);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,4,0);
controls.maxPolarAngle=Math.PI/2.05;
controls.minDistance=12;
controls.maxDistance=75;

scene.add(new THREE.HemisphereLight(0xffffff,0x53617a,2));

const sun=new THREE.DirectionalLight(0xffedc2,3);
sun.position.set(-20,35,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const gold=new THREE.MeshStandardMaterial({
 color:0xd4af37,metalness:.8,roughness:.25
});
const navy=new THREE.MeshStandardMaterial({
 color:0x102d52,metalness:.25,roughness:.35
});
const glass=new THREE.MeshStandardMaterial({
 color:0x5fa9d1,metalness:.35,roughness:.15,
 transparent:true,opacity:.8
});
const white=new THREE.MeshStandardMaterial({
 color:0xe7edf4,roughness:.55
});
const green=new THREE.MeshStandardMaterial({color:0x176b38});
const darkGreen=new THREE.MeshStandardMaterial({color:0x0b4829});

function block(w,h,d,x,y,z,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 scene.add(m);return m;
}

// Ground and campus lawn
block(100,.5,100,0,-.4,0,new THREE.MeshStandardMaterial({color:0x477c43}));
block(100,.15,100,0,-.12,0,new THREE.MeshStandardMaterial({color:0x9c9b91}));

// Main building
block(25,12,12,0,6,0,white);
block(27,1,13,0,12.4,0,navy);
block(27,.35,13,0,.25,0,gold);

// Central entrance
block(7,8,1,0,4.5,6.1,navy);
block(4.5,6,.25,0,3.5,6.8,glass);
block(5,.25,.4,0,6.7,6.95,gold);

// Building wings
block(9,15,11,-17,7.5,0,white);
block(9,15,11,17,7.5,0,white);
block(10,1,12,-17,15.2,0,navy);
block(10,1,12,17,15.2,0,navy);

// Roof details
block(8,.6,7,0,13,0,gold);
block(4,2,4,0,14,0,navy);

// Windows on front
for(let x=-20;x<=20;x+=4){
 for(let y=3;y<=11;y+=3){
  if(Math.abs(x)<3 && y<8) continue;
  block(2,1.8,.18,x,y,6.08,glass);
  block(2.15,.12,.25,x,y+1,6.08,gold);
 }
}

// Side windows
for(let x=-20;x<=20;x+=4){
 for(let y=3;y<=11;y+=3){
  block(.18,1.8,2,x,y,-5.58,glass);
 }
}

// Institute name sign: front upper facade
function makeSign(text,width,height){
 const c=document.createElement('canvas');
 c.width=1600;c.height=260;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#071a35';
 ctx.fillRect(0,0,c.width,c.height);
 ctx.strokeStyle='#d4af37';ctx.lineWidth=12;
 ctx.strokeRect(8,8,c.width-16,c.height-16);
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.font='bold 105px Arial';
 ctx.shadowColor='#ffd966';ctx.shadowBlur=18;
 ctx.fillStyle='#f5d77a';
 ctx.fillText(text,800,132);
 const texture=new THREE.CanvasTexture(c);
 texture.colorSpace=THREE.SRGBColorSpace;
 const material=new THREE.MeshStandardMaterial({
  map:texture,metalness:.45,roughness:.3
 });
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(width,height,.22),material
 );
 mesh.castShadow=true;
 return mesh;
}
const mainSign=makeSign('SIGMA INSTITUTE OF EDUCATION',20,2.5);
mainSign.position.set(0,10.2,6.35);
scene.add(mainSign);

// Main gate and gate pillars
for(const x of [-13,13]){
 block(1,6,1,x,3,19,gold);
 block(2,1,2,x,6.1,19,navy);
}
block(26,.35,.5,0,5.8,19,navy);

const gateSign=makeSign('SIGMA INSTITUTE OF EDUCATION',15,1.7);
gateSign.position.set(0,7.3,19);
scene.add(gateSign);

// Gate road and pathway
block(9,.18,27,0,.05,25,new THREE.MeshStandardMaterial({color:0x777d83}));
block(5,.12,20,0,.14,8,new THREE.MeshStandardMaterial({color:0xc5c2b8}));

// Library building
block(11,6,9,-29,3,0,white);
block(12,.6,10,-29,6.3,0,navy);
block(8,2,.2,-29,4,4.6,glass);
const librarySign=makeSign('LIBRARY',6,1.2);
librarySign.position.set(-29,5.2,4.8);
scene.add(librarySign);

// Computer lab
block(11,6,9,29,3,0,white);
block(12,.6,10,29,6.3,0,navy);
block(8,2,.2,29,4,4.6,glass);
const labSign=makeSign('COMPUTER LAB',7,1.2);
labSign.position.set(29,5.2,4.8);
scene.add(labSign);

// Fountain
const water=new THREE.Mesh(
 new THREE.CylinderGeometry(4,4,.45,48),
 new THREE.MeshStandardMaterial({
  color:0x42bce9,metalness:.6,roughness:.15
 })
);
water.position.set(0,.45,-17);scene.add(water);
const fountainBase=new THREE.Mesh(
 new THREE.CylinderGeometry(4.5,4.8,.5,48),
 white
);
fountainBase.position.set(0,.2,-17);scene.add(fountainBase);
const jet=new THREE.Mesh(
 new THREE.CylinderGeometry(.15,.35,3,16),
 new THREE.MeshStandardMaterial({color:0x83dcff})
);
jet.position.set(0,2,-17);scene.add(jet);

// Trees
function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.4,2.5,10),
  new THREE.MeshStandardMaterial({color:0x754522})
 );
 trunk.position.set(x,1.25,z);scene.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(1.7,16,12),green
 );
 leaves.position.set(x,3.5,z);
 leaves.castShadow=true;scene.add(leaves);
 const top=new THREE.Mesh(
  new THREE.SphereGeometry(1.2,16,12),darkGreen
 );
 top.position.set(x+.4,4.3,z);scene.add(top);
}
for(let x=-38;x<=38;x+=8){
 tree(x,13);tree(x,-25);
}
for(let z=-18;z<=20;z+=9){
 tree(-39,z);tree(39,z);
}

// Garden lights
for(let x=-25;x<=25;x+=10){
 const pole=block(.15,4,.15,x,2,11,
  new THREE.MeshStandardMaterial({color:0x303943}));
 const lamp=new THREE.PointLight(0xffd98a,1,9);
 lamp.position.set(x,4.3,11);scene.add(lamp);
 block(.7,.25,.7,x,4.2,11,gold);
}

// Student character
const student=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.CylinderGeometry(.48,.55,1.5,16),
 navy
);
body.position.y=1.25;student.add(body);
const head=new THREE.Mesh(
 new THREE.SphereGeometry(.42,20,16),
 new THREE.MeshStandardMaterial({color:0xc88e65})
);
head.position.y=2.3;student.add(head);
student.position.set(7,0,14);
scene.add(student);

// Campus tour movement
let touring=false;
let angle=0;
window.tour=()=>{
 touring=!touring;
};
window.resetView=()=>{
 camera.position.set(24,19,30);
 controls.target.set(0,4,0);
 controls.update();
};
let night=false;
window.toggleDay=()=>{
 night=!night;
 scene.background=new THREE.Color(night?0x07152e:0x91bce0);
 scene.fog.color.set(night?0x07152e:0x91bce0);
 sun.intensity=night?.35:3;
 scene.traverse(o=>{
  if(o.isPointLight)o.intensity=night?2:0;
 });
};

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 if(touring){
  angle+=.003;
  camera.position.x=36*Math.sin(angle);
  camera.position.z=36*Math.cos(angle);
  camera.position.y=17+Math.sin(angle*2)*2;
  controls.target.set(0,4,0);
 }
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
